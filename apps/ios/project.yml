name: StrataMobile
options:
  bundleIdPrefix: com.strata.companion
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
  PushDebug: debug
  PushRelease: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 345TZ8AAP7
    CODE_SIGN_STYLE: Automatic
targets:
  StrataMobile:
    type: application
    platform: iOS
    sources: [StrataMobile]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.strata.companion.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "24"
        INFOPLIST_FILE: StrataMobile/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        PushDebug:
          CODE_SIGN_ENTITLEMENTS: StrataMobile/StrataMobilePush.entitlements
          STRATA_APS_ENVIRONMENT: development
          STRATA_PUSH_ENVIRONMENT: sandbox
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG STRATA_PUSH"
        PushRelease:
          CODE_SIGN_ENTITLEMENTS: StrataMobile/StrataMobilePush.entitlements
          STRATA_APS_ENVIRONMENT: production
          STRATA_PUSH_ENVIRONMENT: production
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) STRATA_PUSH"
  StrataMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources: [StrataMobileTests]
    dependencies:
      - target: StrataMobile
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  StrataMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [StrataMobileUITests]
    dependencies:
      - target: StrataMobile
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  StrataMobile:
    build:
      targets:
        StrataMobile: all
    test:
      targets: [StrataMobileTests, StrataMobileUITests]
